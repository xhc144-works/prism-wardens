name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_signed_update_fixture:
        description: '在临时 runner 创建测试密钥与受信任测试证书，验证完整签名升级'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查 · 单元测试 · AI 模拟 · 端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: AI 批量模拟冒烟测试（无渲染）
        run: npm run sim -- --level 1-1,1-2,1-3,1-4 --strategy balanced,defense --runs 5 --json sim-output/sim.json
      - name: 构建 Web 版本
        run: npm run build
      - name: 校验公开构建不含原版素材
        shell: bash
        run: node scripts/check-public-build.mjs
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 端到端测试
        run: npx playwright test
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
            sim-output/
          if-no-files-found: ignore

  windows:
    name: Windows 安装包构建与安装/卸载验证
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 校验公开构建不含原版素材
        shell: bash
        run: node scripts/check-public-build.mjs
      - name: 打包 NSIS 安装包与便携版
        run: npx electron-builder --win --x64 --publish never
      - name: 校验安装包内的 app.asar 不含原版素材
        shell: bash
        run: node scripts/check-public-build.mjs release/win-unpacked/resources/app.asar
      - name: 安装、启动、版本、注册表与卸载验证
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: PrismWardens-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/installed-app.png
      - name: 自动更新端到端测试（临时证书 Authenticode 签名 + Ed25519 更新签名）
        if: github.event_name == 'workflow_dispatch' && inputs.run_signed_update_fixture
        shell: pwsh
        run: ./scripts/test-update-e2e.ps1
