name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查 · 单元测试 · AI 模拟 · 端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: AI 批量模拟冒烟测试（无渲染）
        run: npm run sim -- --level 1-1,1-2,1-3,1-4 --strategy balanced,defense --runs 5 --json sim-output/sim.json
      - name: 构建 Web 版本
        run: npm run build
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 端到端测试
        run: npx playwright test
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
            sim-output/
          if-no-files-found: ignore

  windows:
    name: Windows 安装包构建与安装/卸载验证
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 打包 NSIS 安装包与便携版
        run: npx electron-builder --win --x64 --publish never
      - name: 静默安装 → 校验 → 静默卸载
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'PrismWardens-Setup-*.exe' | Select-Object -First 1
          Write-Host "安装包: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Prism Wardens'
          $exe = Join-Path $dir 'Prism Wardens.exe'
          if (-not (Test-Path $exe)) { throw "安装失败：找不到 $exe" }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "已安装: $($vi.ProductName) $($vi.ProductVersion) / $($vi.FileVersion)"
          $reg = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like '*Prism Wardens*' }
          if (-not $reg) { throw '未找到卸载注册表项' }
          Write-Host "卸载项: $($reg.DisplayName) $($reg.DisplayVersion)"
          Start-Process -FilePath (Join-Path $dir 'Uninstall Prism Wardens.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw '卸载失败：程序文件仍然存在' }
          Write-Host '安装与卸载验证通过'
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: PrismWardens-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
