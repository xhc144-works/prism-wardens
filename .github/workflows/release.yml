name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布到 GitHub Releases
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$pkg" -ne "${{ github.ref_name }}") { throw "package.json 版本 $pkg 与标签 ${{ github.ref_name }} 不一致" }
      - name: 测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: 打包并发布（含 latest.yml 与 blockmap，供自动增量更新）
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
